name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEVISE_JWT_SECRET: ${{ secrets.DEVISE_JWT_SECRET }}

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # BACKEND - Ruby on Rails
      # -------------------------

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.7"
          working-directory: flowboard-backend_api
          bundler-cache: true

      - name: Prepare test database
        working-directory: flowboard-backend_api
        env:
          RAILS_ENV: test
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate

      - name: Run RSpec
        working-directory: flowboard-backend_api
        env:
          RAILS_ENV: test
        run: bundle exec rspec

      # -------------------------
      # FRONTEND - Angular
      # -------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: flowboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: flowboard
        run: npm ci

      - name: Build Angular
        working-directory: flowboard
        run: npm run build

      # -------------------------
      # PLAYWRIGHT E2E
      # -------------------------

      - name: Install Playwright browsers
        working-directory: flowboard
        run: npx playwright install --with-deps chromium

      - name: Check Rails
        working-directory: flowboard-backend_api
        env:
          RAILS_ENV: test
          DEVISE_JWT_SECRET: ${{ secrets.DEVISE_JWT_SECRET }}
        run: |
          echo "=== Rails routes ==="
          bundle exec rails routes > /tmp/routes.txt
          head -30 /tmp/routes.txt

          echo ""
          echo "=== Starting Rails manually ==="
          bundle exec rails server -b 0.0.0.0 -p 3000 > /tmp/rails.log 2>&1 &

          sleep 10

          echo ""
          echo "=== Rails process ==="
          ps aux | grep "[r]ails server" || true

          echo ""
          echo "=== Rails log ==="
          cat /tmp/rails.log

          echo ""
          echo "=== Testing localhost:3000 ==="
          curl -v http://localhost:3000/ || true

      - name: Run Playwright tests
        working-directory: flowboard
        env:
          CI: true
          DEVISE_JWT_SECRET: ${{ secrets.DEVISE_JWT_SECRET }}
        run: npx playwright test --reporter=list